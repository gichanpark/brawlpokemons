.top{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#1c1530;border:3px solid #111;box-shadow:inset 0 3px 0 #3b2d63;padding:7px 12px;font-size:11px}
h1{margin:4px 0 0;font-size:44px;font-weight:400;color:#fde047;text-shadow:3px 0 #111,-3px 0 #111,0 3px #111,0 -3px #111,3px 3px #111,-3px 3px #111,3px -3px #111,-3px -3px #111,0 6px #7c2d12}
.hero{width:200px;height:150px;margin:4px 0;display:flex;align-items:center;justify-content:center}
.hero img{width:auto;height:auto;max-width:100%;max-height:100%;transform-origin:50% 100%;filter:drop-shadow(0 14px 10px rgba(0,0,0,.6));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hname{font-size:22px}
.hrole{opacity:.75;font-size:11px;margin:4px 0 8px}
.btn{border:3px solid #111;border-radius:0;font-size:22px;color:#1a1200;background:#facc15;box-shadow:inset 0 -6px 0 #d97706,inset 0 3px 0 #fef08a,0 6px 0 #111;padding:12px 24px;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 #d97706,0 3px 0 #111}
.btn.b2{background:#3b82f6;color:#fff;box-shadow:inset 0 -6px 0 #1e40af,inset 0 3px 0 #93c5fd,0 6px 0 #111}
.btn.sm{font-size:11px;padding:9px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.modes{display:flex;gap:10px;margin:8px 0 12px;width:100%;max-width:420px}
.mode{flex:1;border-radius:0;padding:10px 12px;background:#1c1530;border:3px solid #111;box-shadow:inset 0 3px 0 #3b2d63;cursor:pointer}
.mode.sel{border-color:#facc15;background:#3b2f10}
.mode b{font-size:11px;display:block;margin-bottom:4px;font-weight:400;color:#fde047}.mode span{font-size:11px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:1.5;align-content:start}
.selwrap{display:flex;gap:12px;width:100%;max-width:900px;margin-top:10px;align-items:flex-start}
.mwrap{display:flex;gap:24px;align-items:center;justify-content:center;width:100%;max-width:900px;flex:1}
.mcol{display:flex;flex-direction:column;align-items:center}
.card{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.03));;border:3px solid #111;border-radius:0;box-shadow:inset 0 3px 0 rgba(255,255,255,.15);padding:11px 2px 3px;cursor:pointer;text-align:center;position:relative}
.card.sel{border-color:#facc15;background:#3b2f10}
.gd{font-size:11px;color:#111;padding:1px 4px;margin-top:3px}.card .gd{display:block}
.card img.por{width:34px;height:34px;border:3px solid #111;background:#0d0a1f;}
.dpor{float:right;width:80px;height:80px;image-rendering:pixelated;border:3px solid #111;margin:0 0 6px 8px}
.card img{height:34px;width:auto;max-width:100%;object-fit:contain;image-rendering:pixelated;margin:4px 0}
.card .n{font-size:11px;white-space:nowrap;letter-spacing:-.5px}
.card .tr{position:absolute;top:2px;left:4px;font-size:11px;color:#fde047}
.detail{flex:1;background:#1c1530;border:3px solid #111;padding:10px 12px;font-size:11px;line-height:1.6}
.detail h3{margin:0 0 6px;font-size:22px;font-weight:400}
.stat{display:flex;gap:8px;align-items:center;margin:3px 0}.stat em{font-style:normal;width:56px;opacity:.8}
.bar{flex:1;height:10px;background:#3f3f46;border:2px solid #111}.bar i{display:block;height:100%;background:#fbbf24;box-shadow:inset 0 2px 0 #fef08a}
.sk{margin-top:8px;padding:7px 9px;background:#2a2140;border:2px solid #111}.sk b{color:#fde68a;font-weight:400}
#res{background:rgba(5,3,15,.84);justify-content:center}
.big{font-size:44px;text-shadow:3px 0 #111,-3px 0 #111,0 3px #111,0 -3px #111,0 6px #111}
.sub{font-size:11px;margin:10px 0 4px;opacity:.9}
.trd{font-size:22px;margin:10px 0 20px;color:#fde047}
.help{font-size:11px;opacity:.65;text-align:center;max-width:440px;margin-top:14px;line-height:1.6}
/* 로딩 */
#load{background:#241a45;justify-content:center;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 24px,transparent 24px 48px)}
.ld-logo{font-size:66px;color:#fde047;text-shadow:4px 0 #111,-4px 0 #111,0 4px #111,0 -4px #111,4px 4px #111,-4px 4px #111,4px -4px #111,-4px -4px #111,0 9px #7c2d12}
.ld-sub{font-size:11px;letter-spacing:6px;color:#c4b5fd;margin:6px 0 10px}
.ld-ball{width:48px;height:48px;animation:spin 1s steps(8) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-bar{width:min(420px,70%);height:18px;border:3px solid #111;background:#3f3f46;margin-top:14px;box-shadow:0 4px 0 #111}
.ld-bar i{display:block;height:100%;width:0;background:#facc15;box-shadow:inset 0 3px 0 #fef08a,inset 0 -3px 0 #d97706;transition:width .15s steps(4)}
.ld-pct{font-size:11px;margin-top:8px}
.ld-tip{font-size:11px;opacity:.75;margin-top:14px;max-width:70%;text-align:center}
/* 로비 */
.lobby{padding:0}
.lobby.on{display:block}
.lb-bg{position:absolute;inset:0;background:linear-gradient(#2747c4 0%,#3b2fa8 55%,#2a1f55 100%)}
.lb-bg:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 26px,transparent 26px 52px)}
.lb-bg:after{content:'';position:absolute;left:0;right:0;bottom:0;height:30%;background:#1c1530;border-top:4px solid #111;box-shadow:inset 0 4px 0 #3b2d63}
.lb-prof{position:absolute;left:12px;top:10px;display:flex;gap:8px;align-items:center;background:#1c1530;border:3px solid #111;box-shadow:inset 0 3px 0 #3b2d63,0 4px 0 #111;padding:5px 12px 5px 5px;cursor:pointer}
#lbAva{width:46px;height:46px;border:3px solid #111;background:#0d0a1f}
.lb-name{font-size:11px;color:#fde047}
.lb-tro{display:flex;gap:5px;align-items:center;font-size:22px;line-height:1}
.ico{width:18px;height:18px;image-rendering:pixelated}.ico.big{width:34px;height:34px}
.lb-road{width:130px;height:8px;background:#3f3f46;border:2px solid #111;margin-top:3px}.lb-road i{display:block;height:100%;width:0;background:#facc15}
.lb-cur{position:absolute;right:12px;top:12px;display:flex;gap:6px;align-items:center;background:#1c1530;border:3px solid #111;box-shadow:inset 0 3px 0 #3b2d63,0 4px 0 #111;padding:6px 14px 6px 8px;font-size:22px}
.lb-snd{position:absolute;right:12px;top:62px;font-family:inherit;font-size:11px;color:#fff;background:#1c1530;border:3px solid #111;box-shadow:inset 0 3px 0 #3b2d63,0 3px 0 #111;padding:5px 9px;cursor:pointer}
.lb-side{position:absolute;left:12px;top:88px;display:flex;flex-direction:column;gap:12px}
.lb-sq{width:86px;height:74px;border:3px solid #111;background:#3b82f6;box-shadow:inset 0 -6px 0 #1e40af,inset 0 3px 0 #93c5fd,0 5px 0 #111;color:#fff;font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0}
.lb-sq:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 #1e40af,0 2px 0 #111}
.lb-sq img{height:36px;width:auto;image-rendering:pixelated}
#bRoad{background:#a855f7;box-shadow:inset 0 -6px 0 #6b21a8,inset 0 3px 0 #d8b4fe,0 5px 0 #111}
.lb-stage{position:absolute;left:50%;bottom:36%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.lb-hero{position:relative;z-index:2;image-rendering:pixelated;animation:bob 2.4s steps(6) infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));margin-bottom:-26px}
.lb-plat{width:210px;height:46px;background:#5b4aa8;border:4px solid #111;border-radius:50%;box-shadow:inset 0 -8px 0 #3b2d78,inset 0 5px 0 #8b7ad8}
.lb-tag{display:flex;align-items:center;gap:8px;background:#111;padding:5px 10px;margin-top:8px;font-size:22px;white-space:nowrap}
.lb-lv{background:#c026d3;border:2px solid #f5d0fe;padding:2px 6px;font-size:11px}
.lb-ttro{display:flex;align-items:center;gap:4px;font-size:11px;color:#fde047}.lb-ttro b{font-weight:400}
.lb-role{font-size:11px;opacity:.8;margin-top:5px;white-space:nowrap}
.lb-bot{position:absolute;right:14px;bottom:16px;display:flex;gap:12px;align-items:flex-end}
.lb-mode{width:176px;height:70px;background:#1c1530;border:3px solid #111;box-shadow:inset 0 3px 0 #3b2d63,0 5px 0 #111;color:#fff;font-family:inherit;text-align:left;padding:6px 10px;cursor:pointer}
.lb-mode small{font-size:11px;opacity:.7;display:block}.lb-mode b{font-size:22px;font-weight:400;color:#fde047;display:block;line-height:1.2}.lb-mode span{font-size:11px;opacity:.85}
.lb-play{width:196px;height:78px;font-size:33px;font-family:inherit;color:#1a1200;background:#facc15;border:3px solid #111;box-shadow:inset 0 -8px 0 #d97706,inset 0 4px 0 #fef08a,0 6px 0 #111;cursor:pointer}
.lb-play:active{transform:translateY(3px);box-shadow:inset 0 -4px 0 #d97706,0 3px 0 #111}
.lb-help{position:absolute;left:12px;bottom:12px;font-size:11px;opacity:.55;max-width:34%;line-height:1.5}
/* 모달 */
.modal{position:absolute;inset:0;background:rgba(5,3,15,.78);display:none;align-items:center;justify-content:center;z-index:30}
.modal.on{display:flex}
.mbox{background:#1c1530;border:3px solid #111;box-shadow:inset 0 3px 0 #3b2d63,0 6px 0 #111;padding:14px 16px;max-width:92%;max-height:92%;overflow:auto}
.mbox h2{font-size:22px;font-weight:400;margin:0 0 10px;color:#fde047}
.mcards{display:flex;gap:12px}
.mcard{width:230px;border:3px solid #111;cursor:pointer;background:#2a2140;box-shadow:0 5px 0 #111}
.mcard.sel{outline:3px solid #facc15}
.mcard .mh{padding:8px 10px;font-size:22px;display:flex;align-items:center;gap:8px}
.mcard .mb{padding:8px 10px;font-size:11px;line-height:1.6;opacity:.9}
.road{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}
.rn{min-width:76px;border:3px solid #111;background:#2a2140;text-align:center;padding:6px 4px;font-size:11px}
.rn.done{background:#3b2f10;border-color:#facc15}
.rn b{display:block;font-size:22px;font-weight:400;color:#fde047}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.minput{font-family:inherit;font-size:22px;padding:6px 8px;border:3px solid #111;background:#0d0a1f;color:#fff;width:240px}
/* 매치메이킹 */
#mm{background:#241a45;justify-content:center;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 24px,transparent 24px 48px)}
.mm-t{font-size:22px;margin-top:12px}.mm-c{font-size:44px;color:#fde047;margin-top:4px}
.vs{display:flex;align-items:center;gap:22px}
.team{display:flex;gap:8px}
.tm{width:96px;text-align:center;font-size:11px}
.tm img{width:84px;height:84px;image-rendering:pixelated;border:4px solid #111;display:block;margin:0 auto 4px}
.tm.b img{background:#2563eb;box-shadow:inset 0 0 0 3px #60a5fa}.tm.r img{background:#dc2626;box-shadow:inset 0 0 0 3px #f87171}
.tm.me{color:#a5f3fc}
.vsx{font-size:66px;color:#fde047;text-shadow:4px 0 #111,-4px 0 #111,0 4px #111,0 -4px #111,0 8px #7c2d12;animation:pop .4s steps(4)}
@keyframes pop{from{transform:scale(2.2)}to{transform:scale(1)}}
.sdg{display:grid;grid-template-columns:repeat(5,74px);gap:8px}
.sdg .tm{width:74px}.sdg .tm img{width:60px;height:60px;background:#7f1d1d}
.sdg .tm.me img{background:#0e7490}
.pw{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.pw .lbv{background:#c026d3;border:2px solid #f5d0fe;padding:2px 6px}
.upbtn{font-family:inherit;font-size:11px;border:3px solid #111;background:#22c55e;color:#052e16;box-shadow:inset 0 -4px 0 #15803d,0 3px 0 #111;padding:5px 9px;cursor:pointer}
.upbtn[disabled]{background:#52525b;color:#d4d4d8;box-shadow:0 3px 0 #111;cursor:default}
.card .lvb{position:absolute;top:46px;right:3px;font-size:11px;color:#f5d0fe;background:#111;padding:0 2px}
.rcoin{font-size:22px;color:#fde047;margin:-8px 0 14px;display:flex;gap:6px;align-items:center}
.rroad{font-size:11px;color:#d8b4fe;margin:-6px 0 14px}
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>

<div id="load" class="scr on">
  <div class="ld-logo">포켓 브롤</div>
  <div class="ld-sub">POKé BRAWL</div>
  <img id="ldBall" class="px ld-ball" alt="">
  <div class="ld-bar"><i id="ldFill"></i></div>
  <div class="ld-pct" id="ldPct">불러오는 중... 0%</div>
  <div class="ld-tip" id="ldTip"></div>
</div>

<div id="menu" class="scr lobby">
  <div class="lb-bg"></div>
  <div class="lb-prof" id="lbProf"><img id="lbAva" class="px" alt=""><div><div class="lb-name" id="lbName"></div><div class="lb-tro"><img class="ico px" data-ico="trophy" alt=""><span id="totTro">0</span></div><div class="lb-road"><i id="lbRoad"></i></div></div></div>
  <div class="lb-cur"><img class="ico px" data-ico="coin" alt=""><span id="lbCoin">0</span></div>
  <button class="lb-snd" id="bSnd">소리 켬</button>
  <div class="lb-side">
    <button class="lb-sq" id="bBrawlers"><img id="lbSqImg" class="px" alt=""><span>포켓몬</span></button>
    <button class="lb-sq" id="bRoad"><img class="ico px big" data-ico="trophy" alt=""><span>트로피 로드</span></button>
  </div>
  <div class="lb-stage">
    <img id="heroImg" class="px lb-hero" alt="">
    <div class="lb-plat"></div>
    <div class="lb-tag"><span class="lb-lv" id="heroLv">파워 1</span><span id="heroName"></span><span class="lb-ttro"><img class="ico px" data-ico="trophy" alt=""><b id="selTro">0</b></span></div>
    <div class="lb-role" id="heroRole"></div>
  </div>
  <div class="lb-bot">
    <button class="lb-mode" id="bMode"><small>게임 모드 ▸</small><b id="modeName">젬 그랩</b><span id="modeDesc"></span></button>
    <button class="lb-play" id="bPlay">플레이</button>
  </div>
  <div class="lb-help">왼쪽 드래그 이동 · 오른쪽 드래그 후 놓기 공격 · 짧게 탭 자동 조준 · ★ 필살기</div>
</div>

<div id="sel" class="scr">
  <div class="top"><button class="btn b2 sm" id="bBack">← 뒤로</button><div class="pill">포켓몬 선택</div></div>
  <div class="selwrap"><div class="grid" id="grid"></div>
  <div class="detail" id="detail"></div></div>
</div>

<div id="res" class="scr">
  <div class="big" id="rBig">승리!</div>
  <div class="sub" id="rSub"></div>
  <div class="trd" id="rTro"></div>
  <div class="rcoin" id="rCoin"></div>
  <div class="rroad" id="rRoad"></div>
  <div class="row"><button class="btn" id="bAgain">다시 하기</button><button class="btn b2" id="bMenu">메뉴로</button></div>
</div>

<div id="mm" class="scr"><div id="mmIn"></div></div>
<div id="modal" class="modal"><div class="mbox" id="mbox"></div></div>
</div>

const GG_B=[

const GG_M="BB..#...........#..BB";
function buildGemMap(){
  const rows=[];
  for(let i=GG_B.length-1;i>=0;i--)rows.push(GG_B[i].split('').reverse().join('').replace(/b/g,'r'));
  rows.push(GG_M);for(const r of GG_B)rows.push(r);
  const OR=rows.length,C=OR,R=21,g=new Uint8Array(C*R),sp=[[],[]];
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const ch=rows[OR-1-x][y]||'.';
    g[y*C+x]=ch==='#'?1:ch==='B'?2:ch==='~'?3:0;
    if(ch==='b')sp[0].push([(x+.5)*T,(y+.5)*T]);
    if(ch==='r')sp[1].push([(x+.5)*T,(y+.5)*T]);
  }
  sp[0].sort((a,b)=>a[1]-b[1]);sp[1].sort((a,b)=>a[1]-b[1]);
  return {C,R,g,bhp:new Float32Array(C*R),sp,mine:{x:15.5*T,y:10.5*T}};
}
function buildSDMap(){
  const C=38,R=38,h=19,g=new Uint8Array(C*R),bhp=new Float32Array(C*R);

  for(let i=0;i<10;i++){const x=rnd(h),y=rnd(h),hz=Math.random()<.5,len=2+rnd(3);
    for(let k=0;k<len;k++)set(hz?x+k:x,hz?y:y+k,1);
    if(Math.random()<.4)set(hz?x:x+1,hz?y+1:y,1);}
  for(let i=0;i<10;i++){const x=rnd(h),y=rnd(h),w=2+rnd(3),hh=2+rnd(2);
    for(let a=0;a<w;a++)for(let b=0;b<hh;b++)if(x+a<h&&y+b<h&&g[(y+b)*C+x+a]===0)set(x+a,y+b,2);}
  for(let i=0;i<2;i++){const x=2+rnd(h-4),y=2+rnd(h-4);for(let a=0;a<2;a++)for(let b=0;b<2;b++)set(x+a,y+b,3);}
  for(let i=0;i<6;i++)set(1+rnd(h-1),1+rnd(h-1),4);
  const sp=[];
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2+.31;sp.push([Math.floor(C/2+Math.cos(a)*14),Math.floor(R/2+Math.sin(a)*14)]);}
  for(const [x,y] of sp)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<C&&Y<R)g[Y*C+X]=0;}
  for(let dy=-2;dy<2;dy++)for(let dx=-2;dx<2;dx++)g[(R/2+dy)*C+C/2+dx]=0;
  [[-3,-3],[2,-3],[-3,2],[2,2]].forEach(([dx,dy])=>g[(R/2+dy)*C+C/2+dx]=4);
  const pass=v=>v!==1&&v!==3, ci=(R/2)*C+C/2;
  const bfs=()=>{const seen=new Uint8Array(C*R),q=[ci];seen[ci]=1;
    while(q.length){const i=q.pop(),x=i%C,y=(i/C)|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=C||Y>=R)continue;const j=Y*C+X;if(!seen[j]&&pass(g[j])){seen[j]=1;q.push(j);}}}
    return seen;};
  let seen=bfs();
  for(const [x,y] of sp){if(seen[y*C+x])continue;
    let px=x,py=y;const tx=C/2,ty=R/2;
    while(Math.abs(px-tx)+Math.abs(py-ty)>0){if(Math.abs(px-tx)>Math.abs(py-ty))px+=Math.sign(tx-px);else py+=Math.sign(ty-py);if(!pass(g[py*C+px]))g[py*C+px]=0;}
  }
  seen=bfs();
  for(let i=0;i<C*R;i++){if(!seen[i]&&pass(g[i]))g[i]=1;if(g[i]===4)bhp[i]=2600;}
  return {C,R,g,bhp,sp:sp.map(([x,y])=>[(x+.5)*T,(y+.5)*T]),center:{x:C/2*T,y:R/2*T}};
}

/* ---------- 유틸 ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function tileAt(tx,ty){const m=G.map;if(tx<0||ty<0||tx>=m.C||ty>=m.R)return 1;return m.g[ty*m.C+tx];}
const tAtP=(x,y)=>tileAt(Math.floor(x/T),Math.floor(y/T));
const blocksMove=t=>t===1||t===3||t===4;
const blocksShot=t=>t===1||t===4;
const walkable=t=>t===0||t===2;
function inBush(e){return tAtP(e.x,e.y)===2;}
function enemyOf(a,b){return a.team!==b.team;}
function visibleTo(e,team){
  if(e.team===team)return true;
  if(e.reveal>0||!inBush(e))return true;
  for(const o of G.ents)if(o.alive&&o.team===team&&(o.x-e.x)**2+(o.y-e.y)**2<(2.3*T)**2)return true;
  return false;
}
function los(x0,y0,x1,y1,ignore){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/12);
  for(let i=1;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n,tx=Math.floor(x/T),ty=Math.floor(y/T);
    if(blocksShot(tileAt(tx,ty)))return ignore!==undefined&&ty*G.map.C+tx===ignore;}
  return true;
}
function clearPath(x0,y0,x1,y1,r){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/14),nx=-(y1-y0)/(d||1),ny=(x1-x0)/(d||1);
  for(let i=1;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;
    for(const o of [-r*.8,0,r*.8])if(blocksMove(tAtP(x+nx*o,y+ny*o)))return false;}
  return true;
}
function collide(e){
  const r=e.r;
  for(let k=0;k<2;k++){
    const x0=Math.floor((e.x-r)/T),x1=Math.floor((e.x+r)/T),y0=Math.floor((e.y-r)/T),y1=Math.floor((e.y+r)/T);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      if(!blocksMove(tileAt(tx,ty)))continue;
      const cx=clamp(e.x,tx*T,tx*T+T),cy=clamp(e.y,ty*T,ty*T+T);
      let dx=e.x-cx,dy=e.y-cy;const d2=dx*dx+dy*dy;
      if(d2<r*r){
        if(d2<1e-6){snapWalkable(e);return;}
        const d=Math.sqrt(d2);e.x+=dx/d*(r-d);e.y+=dy/d*(r-d);
      }
    }
  }
}
function snapWalkable(e){
  const m=G.map;let bx=Math.floor(e.x/T),by=Math.floor(e.y/T);
  if(walkable(tileAt(bx,by))&&bx>=0&&by>=0&&bx<m.C&&by<m.R)return;
  let best=null,bd=1e9;
  for(let r=1;r<8&&!best;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const X=bx+dx,Y=by+dy;if(walkable(tileAt(X,Y))){const d=dx*dx+dy*dy;if(d<bd){bd=d;best=[X,Y];}}}
  if(best){e.x=(best[0]+.5)*T;e.y=(best[1]+.5)*T;}
}
function getField(goal){
  const m=G.map;let f=G.fields.get(goal);if(f)return f;
  if(G.fields.size>300)G.fields.clear();
  f=new Float32Array(m.C*m.R).fill(1e9);f[goal]=0;const q=[goal];let h=0;
  while(h<q.length){const i=q[h++],x=i%m.C,y=(i/m.C)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=m.C||Y>=m.R)continue;
      const j=Y*m.C+X;if(f[j]>f[i]+1&&walkable(m.g[j])){f[j]=f[i]+1;q.push(j);}}}
  G.fields.set(goal,f);return f;
}
function steer(e,gx,gy){
  const m=G.map,dx=gx-e.x,dy=gy-e.y,d=Math.hypot(dx,dy);
  if(d<10)return [0,0];
  if(d<T*5&&clearPath(e.x,e.y,gx,gy,e.r))return [dx/d,dy/d];
  const gtx=clamp(Math.floor(gx/T),0,m.C-1),gty=clamp(Math.floor(gy/T),0,m.R-1);
  const f=getField(gty*m.C+gtx);
  const cx=Math.floor(e.x/T),cy=Math.floor(e.y/T);
  if(cx<0||cy<0||cx>=m.C||cy>=m.R)return [dx/d,dy/d];
  let best=f[cy*m.C+cx],bx=cx,by=cy;
  for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
    if(!ox&&!oy)continue;const X=cx+ox,Y=cy+oy;if(X<0||Y<0||X>=m.C||Y>=m.R)continue;
    if(ox&&oy&&(!walkable(tileAt(cx+ox,cy))||!walkable(tileAt(cx,cy+oy))))continue;
    const v=f[Y*m.C+X]+(ox&&oy?.4:0);if(v<best){best=v;bx=X;by=Y;}
  }
  if(bx===cx&&by===cy)return [dx/d,dy/d];
  const tx=(bx+.5)*T-e.x,ty=(by+.5)*T-e.y,tl=Math.hypot(tx,ty)||1;
  return [tx/tl,ty/tl];
}

  if(G.over){G.endT-=dt;if(G.endT<=0&&!G.shown){G.shown=1;showResult();}}
  if(G.intro>0){const pi=Math.ceil(G.intro);G.intro-=dt;const ni=Math.ceil(G.intro);if(ni!==pi)sfx(ni>0?'count':'go');if(G.introBeep==null){G.introBeep=1;sfx('count');}updateCam(dt);return;}
  if(G.hitstop>0){G.hitstop-=dt;G.shake=Math.max(0,G.shake-dt);return;}
  if(G.slowT>0){G.slowT-=dt;dt*=.4;}
  G.hurtV=Math.max(0,(G.hurtV||0)-dt);G.kick=G.kick?{x:G.kick.x*Math.max(0,1-dt*14),y:G.kick.y*Math.max(0,1-dt*14)}:{x:0,y:0};
  G.t+=dt;
  // 입력 → 플레이어 이동
  if(P.alive){
    let mx=0,my=0;
    if(IN.mv){const dx=IN.mv.x-IN.mv.sx,dy=IN.mv.y-IN.mv.sy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/45)/l;mx=dx*k;my=dy*k;}}
    const K=IN.keys;

    const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;}

  for(const e of G.ents){
    if(!e.alive){if(G.mode==='gem'&&!G.over){e.respawn-=dt;if(e.respawn<=0)respawn(e);}continue;}

function ai(e,dt){

    const d=dist(e,t),a=e.ch.atk,s=e.ch.sup;

      else if(d<s.range*T*.9&&(s.thru||los(e.x,e.y,t.x,t.y)))ok=botFire(e,t,true);
      if(ok){A.fcd=.5;return;}
    }
    if(e.ammo>=1&&d<a.range*T*.95&&(a.ty==='lob'||los(e.x,e.y,t.x,t.y))){
      if(e.ammo>=2||e.hp<e.maxHp*.5||Math.random()<.4)botFire(e,t,false);

  const A=e.ai,m=G.map;
  let ne=null,nd=1e9;
  for(const o of G.ents){if(!o.alive||o.team===e.team||!visibleTo(o,e.team))continue;let d=dist(e,o);if(o.hp<o.maxHp*.4)d*=.8;if(d<nd){nd=d;ne=o;}}
  const rng=e.ch.atk.range*T,pref=Math.max(rng*.7,T*1.3);
  A.tgt=ne&&nd<Math.max(rng*1.5,6*T)?ne:null;A.box=null;
  const low=e.hp<e.maxHp*.33&&ne&&nd<rng*1.4;
  if(G.mode==='sd'){
    const a=(G.gas+1.5)*T,b=(m.C-G.gas-1.5)*T;
    if(e.x<a||e.x>b||e.y<a||e.y>b){A.mode='move';A.gx=m.center.x;A.gy=m.center.y;return;}
  }
  if(low){
    A.mode='flee';
    if(G.mode==='gem'){A.gx=e.sx;A.gy=e.sy;}
    else{const dx=e.x-ne.x,dy=e.y-ne.y,l=Math.hypot(dx,dy)||1;A.gx=clamp(e.x+dx/l*4*T,(G.gas+2)*T,(m.C-G.gas-2)*T);A.gy=clamp(e.y+dy/l*4*T,(G.gas+2)*T,(m.R-G.gas-2)*T);}
    return;
  }
  if(G.mode==='gem'&&e.gems>=3&&teamGems(e.team)>=8&&!(ne&&nd<rng)){A.mode='hold';const dir=e.team===0?1:-1;A.gx=e.sx+dir*3*T;A.gy=e.sy;return;}
  if(A.tgt){A.mode='fight';const dx=e.x-ne.x,dy=e.y-ne.y,l=Math.hypot(dx,dy)||1;
    if(e.ch.atk.ty!=='lob'&&!los(e.x,e.y,ne.x,ne.y)){A.gx=ne.x;A.gy=ne.y;}else{A.gx=ne.x+dx/l*pref;A.gy=ne.y+dy/l*pref;}return;}
  A.mode='move';
  if(A.gx==null||Math.hypot(A.gx-e.x,A.gy-e.y)<T*.8||!A.jit||Math.random()<.04)A.jit=[(Math.random()-.5)*3*T,(Math.random()-.5)*3*T];
  let best=null,bd=1e9;
  for(const it of G.items){if(G.mode==='gem'&&it.ty!=='gem')continue;const d=Math.hypot(it.x-e.x,it.y-e.y);if(d<bd){bd=d;best=it;}}
  if(G.mode==='gem'){
    if(best&&(bd<8*T||A.slot===0)){A.gx=best.x;A.gy=best.y;return;}
    const dir=e.team===0?1:-1,off=[[0,1.5],[-4,2.5],[4,2.5]][A.slot];
    A.gx=m.mine.x-off[1]*T*dir+A.jit[0];A.gy=m.mine.y+off[0]*T+A.jit[1];return;
  }
  if(best&&bd<10*T){A.gx=best.x;A.gy=best.y;return;}
  let bb=null;bd=1e9;
  for(let i=0;i<m.g.length;i++)if(m.g[i]===4){const x=(i%m.C+.5)*T,y=((i/m.C|0)+.5)*T,d=Math.hypot(x-e.x,y-e.y);if(d<bd){bd=d;bb={i,x,y};}}
  if(bb){A.box=bb;const dx=e.x-bb.x,dy=e.y-bb.y,l=Math.hypot(dx,dy)||1,k=Math.min(pref,l);if(e.ch.atk.ty!=='lob'&&!los(e.x,e.y,bb.x,bb.y,bb.i)){A.gx=bb.x;A.gy=bb.y;}else{A.gx=bb.x+dx/l*k;A.gy=bb.y+dy/l*k;}return;}
  A.gx=m.center.x+Math.cos(A.ph)*3*T+A.jit[0];A.gy=m.center.y+Math.sin(A.ph)*3*T+A.jit[1];
}

const IN={mv:null,atk:null,sup:null,keys:{},mp:null};

function scale(){return Math.min(1.3,Math.min(W,H)/(10*T));}
function s2w(x,y){const S=scale();return {x:(x-W/2)/S+G.cam.x,y:(y-H/2)/S+G.cam.y};}
function autoTarget(e,s){
  const R=(s.range||(s.aoe?s.aoe+1:5))*T*1.05;let best=null,bd=R;
  for(const o of G.ents){if(!o.alive||o.team===e.team||!visibleTo(o,e.team))continue;const d=dist(e,o);if(d<bd){bd=d;best=o;}}
  if(best)return {x:best.x+best.vx*.15,y:best.y+best.vy*.15};
  if(G.mode==='sd'){const m=G.map;for(let i=0;i<m.g.length;i++)if(m.g[i]===4){const x=(i%m.C+.5)*T,y=((i/m.C|0)+.5)*T,d=Math.hypot(x-e.x,y-e.y);if(d<bd){bd=d;best={x,y};}}}

function playerFire(sup,ang,d){
  if(!P.alive||G.over)return;

}

  try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.32;MG.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}
}

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.03);}

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+dur+.03);}

const rnd=(a,b)=>a+Math.random()*(b-a);

/* 적중 처리 (공격 개성) */
function hitEff(src,t,s,dmg,sup,dx,dy){
  if(!t.alive)return;
  let m=1;
  if(s.crit&&Math.random()<s.crit){m*=2;addText(t.x,t.y-95,'급소!','#fde047');}
  if(s.exec&&t.hp<t.maxHp*.5)m*=s.exec;
  if(s.combo&&src){src.combo=(src.combo||0)+1;if(src.combo%3===0){m*=2;addText(t.x,t.y-95,'콤보!','#fca5a5');spark(t.x,t.y-20,['#fff','#ef4444'],10,220,.35,6,{sh:'plus'});}}
  const before=t.hp;damage(src,t,dmg*m,sup);
  const dealt=Math.max(0,before-Math.max(0,t.hp));
  if(s.ls&&src&&dealt>0)heal(src,dealt*s.ls);
  if(!t.alive)return;
  if(s.stun)t.stun=Math.max(t.stun,s.stun);
  if(s.slow&&Math.random()<(s.slow.c==null?1:s.slow.c)){t.slowT=Math.max(t.slowT||0,s.slow.t);t.slowM=s.slow.m||.6;t.slowCol=pal(s)[0];}
  if(s.burn){t.burnT=s.burn.t;t.burnDps=s.burn.dps;t.burnSrc=src;}
  const l=Math.hypot(dx,dy)||1;
  if(s.kb){t.kbx=dx/l*s.kb*T*5.5;t.kby=dy/l*s.kb*T*5.5;}
  if(s.pull&&src){const px=src.x-t.x,py=src.y-t.y,pl=Math.hypot(px,py)||1;t.kbx=px/pl*s.pull*T*5;t.kby=py/pl*s.pull*T*5;}
}

/* 파티클 그리기 */
const DAI=['....X....','....X....','XXXXXXXXX','....X....','...X.X...','..X...X..','.X.....X.','X.......X'];
function drawPart(p){
  const k=p.t/p.l;
  if(p.ring){ctx.strokeStyle=p.col;ctx.globalAlpha=Math.min(1,k*1.5);ctx.lineWidth=Math.max(3,9*k);ctx.beginPath();ctx.arc(p.x,p.y,p.rad*(1.15-k*.5),0,7);ctx.stroke();ctx.globalAlpha=1;return;}
  ctx.globalAlpha=k>.35?1:k/.35;
  switch(p.sh){
    case 'bolt':ctx.strokeStyle=p.col;ctx.lineWidth=p.w||5;ctx.beginPath();p.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();break;
    case 'plus':{const r=Math.max(3,Math.round(p.r/3)*3);ctx.fillStyle=p.col;ctx.fillRect(p.x-r*1.5,p.y-r/2,r*3,r);ctx.fillRect(p.x-r/2,p.y-r*1.5,r,r*3);break;}
    case 'star':ctx.fillStyle=p.col;const u=3;for(const [dx,dy] of [[0,-2],[0,-1],[-1,0],[0,0],[1,0],[0,1],[0,2],[-2,0],[2,0]])ctx.fillRect(Math.round(p.x/3)*3+dx*u,Math.round(p.y/3)*3+dy*u,u,u);break;
    case 'leaf':ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x/3)*3-6,Math.round(p.y/3)*3-3,9,6);ctx.fillStyle='#d9f99d';ctx.fillRect(Math.round(p.x/3)*3-3,Math.round(p.y/3)*3-3,3,3);break;
    case 'line':ctx.strokeStyle=p.col;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);ctx.stroke();break;
    case 'dai':{const u=Math.round((1.2-k*.3)*12/3)*3,cols=['#fde047','#f97316','#dc2626'];ctx.globalAlpha=Math.min(1,k*2);
      for(let pass=0;pass<2;pass++)for(let j=0;j<DAI.length;j++)for(let i=0;i<9;i++)if(DAI[j][i]==='X'){const X=p.x+(i-4)*u*1.6,Y=p.y+(j-4)*u*1.6;
        if(pass===0){ctx.fillStyle='#7c2d12';ctx.fillRect(X-u,Y-u,u*3.2,u*3.2);}else{ctx.fillStyle=cols[(i+j+Math.floor(G.t*10))%3];ctx.fillRect(X-u*.6,Y-u*.6,u*2.4,u*2.4);}}break;}
    default:{const r=Math.max(3,Math.round(p.r*(.5+k*.7)/3)*3);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x/3)*3-r/2,Math.round(p.y/3)*3-r/2,r,r);}
  }
  ctx.globalAlpha=1;
}

function drawZone(z){
  const k=z.kind;
  if(k==='sun'){ctx.fillStyle='rgba(253,224,71,.18)';ctx.strokeStyle='rgba(253,224,71,.85)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(254,240,138,.45)';ctx.lineWidth=9;for(let i=0;i<6;i++){const a=i/6*6.283+G.t*.4;ctx.beginPath();ctx.moveTo(z.x+Math.cos(a)*z.r*.2,z.y+Math.sin(a)*z.r*.2);ctx.lineTo(z.x+Math.cos(a)*z.r*.9,z.y+Math.sin(a)*z.r*.9);ctx.stroke();}
    for(let i=0;i<8;i++){const a=i/8*6.28+G.t*.5;drawFlower(Math.round(z.x+Math.cos(a)*z.r*.6),Math.round(z.y+Math.sin(a)*z.r*.6));}}
  else if(k==='mist'){ctx.fillStyle='rgba(249,168,212,.22)';ctx.strokeStyle='rgba(251,207,232,.85)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();ctx.stroke();
    for(let i=0;i<14;i++){const a=i*2.4+G.t*.3,d=z.r*((i*37%10)/12),x=z.x+Math.cos(a)*d,y=z.y+Math.sin(a)*d*.8;ctx.fillStyle=i%2?'rgba(255,255,255,.35)':'rgba(249,168,212,.4)';ctx.fillRect(Math.round(x/3)*3-12,Math.round(y/3)*3-6,24,12);}}
  else{ctx.fillStyle='rgba(126,34,206,.28)';ctx.strokeStyle='rgba(168,85,247,.8)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();ctx.stroke();
    for(let i=0;i<6;i++){const ph=(G.t*1.5+i*.37)%1,a=i*1.9,x=z.x+Math.cos(a)*z.r*.55,y=z.y+Math.sin(a)*z.r*.55-ph*20;ctx.globalAlpha=1-ph;ctx.fillStyle='#c084fc';ctx.fillRect(Math.round(x/3)*3-4,Math.round(y/3)*3-4,9,9);}ctx.globalAlpha=1;}
}

const PX=3,MAIN=ctx;

function fxSize(){const w=Math.ceil(W/PX),h=Math.ceil(H/PX);for(const c of [fxG,fxT,fxU])if(c.width!==w||c.height!==h){c.width=w;c.height=h;}}
function beginWorldFx(c){const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);const k=VIEW.S/PX;x.setTransform(k,0,0,k,VIEW.ox/PX,VIEW.oy/PX);x.imageSmoothingEnabled=false;ctx=x;}
function beginScreenFx(c){const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.setTransform(1/PX,0,0,1/PX,0,0);x.imageSmoothingEnabled=false;ctx=x;}
function endFx(c){ctx=MAIN;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;ctx.drawImage(c,0,0,c.width*PX,c.height*PX);}
function worldT(){ctx=MAIN;ctx.setTransform(DPR*VIEW.S,0,0,DPR*VIEW.S,DPR*VIEW.ox,DPR*VIEW.oy);ctx.imageSmoothingEnabled=false;}

function buildFloor(m){

  for(let ty=-FM;ty<m.R+FM;ty++)for(let tx=-FM;tx<m.C+FM;tx++){
    const X=(tx+FM)*S,Y=(ty+FM)*S,inb=tx>=0&&ty>=0&&tx<m.C&&ty<m.R,v=inb?m.g[ty*m.C+tx]:0,h=hsh(tx,ty);
    if(v===3){c.drawImage(TI.water,X,Y,S,S);c.fillStyle='rgba(255,255,255,.55)';
      if(tileAt(tx,ty-1)!==3)c.fillRect(X,Y,S,1);if(tileAt(tx,ty+1)!==3)c.fillRect(X,Y+S-1,S,1);if(tileAt(tx-1,ty)!==3)c.fillRect(X,Y,1,S);if(tileAt(tx+1,ty)!==3)c.fillRect(X+S-1,Y,1,S);continue;}

      if(N)d=Math.min(d,j);if(So)d=Math.min(d,S-1-j);if(We)d=Math.min(d,i);if(E)d=Math.min(d,S-1-i);

    tf.forEach(([a,b],k)=>tuft(X+a,Y+b,1,(h+k)%2,c));

    pbox(cx-84,9,168,36,'#1c1530');pix('skull',cx-54,27,3);tx('생존 '+n+'명',cx+12,36,22,'#fff');
    if(P.cubes>0){pbox(cx-84,52,60,24,'#1c1530');pix('cube',cx-66,64,2);tx(String(P.cubes),cx-46,70,11,'#fff','left');}
    if(G.t>18&&G.t<25&&!G.over)tx('독가스 접근 중! '+Math.ceil(25-G.t),cx,96,11,'#e9d5ff');
  }
  MAIN.font='11px '+FONT+',monospace';
  G.feed.slice(-4).forEach((f,i)=>{const y=86+i*24;const w=Math.ceil(MAIN.measureText(f.s).width)+16;pbox(W-12-w,y-15,w,20,'rgba(20,14,40,.75)');tx(f.s,W-20,y,11,f.mine?'#fde047':'#fff','right',Math.min(1,f.t));});
  if(!P.alive&&G.mode==='gem'&&!G.over)tx('부활까지 '+Math.ceil(P.respawn)+'초',W/2,H/2-60,22,'#fff');
  if(G.intro>0){tx(G.mode==='gem'?'젬 그랩':'쇼다운',W/2,H/2-110,22,'#fff');tx(String(Math.ceil(G.intro)),W/2,H/2-30,88,'#fde047');}
  else if(G.t<1)tx('시작!',W/2,H/2-40,44,'#fde047','center',1-G.t);
  if(G.over&&G.result)tx(G.result.big,W/2,H/2-40,44,'#fde047');
  const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  if(touch&&!(G.mode==='sd'&&!P.alive)){
    if(IN.mv)stick(IN.mv.sx,IN.mv.sy,IN.mv.x,IN.mv.y,'rgba(255,255,255,.2)','rgba(255,255,255,.75)',60);
    else{ctx.globalAlpha=.35;stick(100,H-110,100,H-110,'rgba(255,255,255,.15)','rgba(255,255,255,.5)',55);ctx.globalAlpha=1;}
    const ab=atkBase();
    if(IN.atk)stick(IN.atk.sx,IN.atk.sy,IN.atk.x,IN.atk.y,'rgba(251,146,60,.28)','#fb923c',60);
    else{ctx.globalAlpha=.65;stick(ab.x,ab.y,ab.x,ab.y,'rgba(251,146,60,.22)','#fb923c',ab.r);ctx.globalAlpha=1;}
    for(let i=0;i<3;i++){const f=clamp(P.ammo-i,0,1),a0=-Math.PI/2+i*2.094+.1,a1=a0+2.094-.2;
      ctx.lineWidth=9;ctx.strokeStyle='#111';ctx.beginPath();ctx.arc(ab.x,ab.y,ab.r+9,a0,a1);ctx.stroke();
      if(f>0){ctx.lineWidth=6;ctx.strokeStyle=f>=1?'#fb923c':'#b45309';ctx.beginPath();ctx.arc(ab.x,ab.y,ab.r+9,a0,a0+(a1-a0)*f);ctx.stroke();}}
    const sb=supBtn(),ready=P.sc>=1;
    if(IN.sup&&ready)stick(IN.sup.sx,IN.sup.sy,IN.sup.x,IN.sup.y,'rgba(253,224,71,.28)','#fde047',60);
    else{ctx.fillStyle='#111';ctx.beginPath();ctx.arc(sb.x,sb.y,sb.r+4,0,7);ctx.fill();
      ctx.fillStyle=ready?'#facc15':'#2a2140';ctx.beginPath();ctx.arc(sb.x,sb.y,sb.r,0,7);ctx.fill();
      ctx.strokeStyle='#fde047';ctx.lineWidth=6;ctx.beginPath();ctx.arc(sb.x,sb.y,sb.r-3,-Math.PI/2,-Math.PI/2+6.283*P.sc);ctx.stroke();
      if(ready&&Math.floor(G.t*4)%2){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(sb.x,sb.y,sb.r+10,0,7);ctx.stroke();}
      pix('star',sb.x,sb.y,6);}
  }
  endFx(fxU);
  screenT();
  for(const t of TX){ctx.globalAlpha=t[6]==null?1:clamp(t[6],0,1);ptext(t[0],t[1],t[2],t[3],t[4],t[5]);}
  ctx.globalAlpha=1;
}
function stick(bx,by,x,y,fill,knob,R){
  ctx.fillStyle=fill;ctx.beginPath();ctx.arc(bx,by,R,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=4;ctx.stroke();
  let dx=x-bx,dy=y-by;const l=Math.hypot(dx,dy);if(l>R){dx=dx/l*R;dy=dy/l*R;}
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bx+dx,by+dy,R*.42+3,0,7);ctx.fill();
  ctx.fillStyle=knob;ctx.beginPath();ctx.arc(bx+dx,by+dy,R*.42,0,7);ctx.fill();
}
function drawAim(){
  if(!P.alive)return;
  let st=null,sup=false;
  if(IN.sup){st=IN.sup;sup=true;}else if(IN.atk)st=IN.atk;
  let ang,f;
  if(st){const dx=st.x-st.sx,dy=st.y-st.sy,l=Math.hypot(dx,dy);if(l<14)return;ang=Math.atan2(dy,dx);f=Math.min(1,l/60);}
  else if(IN.mp&&!('ontouchstart' in window)){const w=s2w(IN.mp.x,IN.mp.y);ang=Math.atan2(w.y-P.y,w.x-P.x);f=Math.min(1,Math.hypot(w.x-P.x,w.y-P.y)/(P.ch.atk.range*T));sup=false;}
  else return;
  const s=sup?P.ch.sup:P.ch.atk,R=(s.range||0)*T;
  if(sup&&P.sc<1)return;
  ctx.fillStyle=sup?'rgba(253,224,71,.3)':'rgba(255,255,255,.22)';ctx.strokeStyle=sup?'rgba(253,224,71,.8)':'rgba(255,255,255,.6)';ctx.lineWidth=2;
  if(s.ty==='disguise'||s.ty==='buff')return;
  if(s.ty==='nova'){ctx.beginPath();ctx.arc(P.x,P.y,s.aoe*T,0,7);ctx.fill();ctx.stroke();return;}
  if(s.ty==='lob'||s.ty==='zone'||s.ty==='leap'||s.ty==='tele'||s.ty==='meteor'){
    const tx=P.x+Math.cos(ang)*R*f,ty=P.y+Math.sin(ang)*R*f,rad=((s.area?s.area+s.aoe:0)||s.aoe||s.zr||1)*T;
    ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(tx,ty,rad,0,7);ctx.fill();ctx.stroke();return;}
  ctx.save();ctx.translate(P.x,P.y);ctx.rotate(ang);
  if((s.count||1)>1&&s.spread>.2){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,-s.spread/2-.05,s.spread/2+.05);ctx.closePath();ctx.fill();ctx.stroke();}
  else{const w=s.ty==='dash'?P.r*2:Math.max(14,(s.r||10)*2);rr(0,-w/2,R,w,w/2);ctx.fill();ctx.stroke();}
  ctx.restore();
}
/* ---------- 로비 / 로딩 / 매치메이킹 ---------- */
const ICON_ROWS={
 trophy:['.kkkkkkk.','kyyyywyyk','kyyyywyyk','kyyyyyyyk','.kyyyyyk.','..kyyyk..','...kyk...','...kyk...','..kkkkk..','..kyyyk..','..kkkkk..'],
 coin:['..kkkk..','.kyyyyk.','kyywyyok','kywyyyok','kyyyyyok','kyyyyook','.kooook.','..kkkk..'],
 ball:['....kkkk....','..kkrrrrkk..','.krrrrrwwrk.','.krrrrrrwrk.','krrrrrrrrrrk','kkkkkwwkkkkk','kwwwkwwkwwwk','kwwwwkkwwwwk','.kwwwwwwwwk.','.kwwwwwwwwk.','..kkwwwwkk..','....kkkk....'],
 gem:['....k....','...kak...','..kabbk..','.kabbbck.','kabbbbbck','.kbbbbck.','..kbbck..','...kck...','....k....'],
 skull:['.kkkkkkk.','kwwwwwwwk','kwkkwkkwk','kwkkwkkwk','kwwwwwwwk','.kwkwkwk.','.kwwwwwk.','..kkkkk..']};
const ICON_PAL={k:'#111',y:'#facc15',w:'#f8fafc',o:'#d97706',r:'#ef4444',a:'#fff',b:'#c084fc',c:'#7e22ce'};
function iconURI(name,sc){const rows=ICON_ROWS[name],h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w*sc;c.height=h*sc;const x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(ch==='.')continue;x.fillStyle=ICON_PAL[ch];x.fillRect(i*sc,j*sc,sc,sc);}return c.toDataURL();}
const ICO={};for(const k in ICON_ROWS)ICO[k]=iconURI(k,4);
document.querySelectorAll('img[data-ico]').forEach(im=>im.src=ICO[im.dataset.ico]);
$('#ldBall').src=ICO.ball;

const ROAD=[{t:10,c:50},{t:30,c:80},{t:60,c:120},{t:100,c:160},{t:150,c:200},{t:200,c:250},{t:300,c:300},{t:400,c:400},{t:500,c:500},{t:750,c:700},{t:1000,c:1000}];
const lv=k=>(SAVE.lv&&SAVE.lv[k])||1;
const upCost=l=>l*25;
const MODES={gem:{nm:'젬 그랩',ds:'3대3 · 보석 10개 들고 15초',ico:'gem',col:'#7e22ce',long:'광산에서 나오는 보석을 모으세요. 팀이 10개 이상을 들고 15초를 버티면 승리! 쓰러지면 들고 있던 보석을 떨어뜨려요.'},
 sd:{nm:'쇼다운',ds:'10명 생존전 · 파워큐브',ico:'skull',col:'#b91c1c',long:'최후의 1인이 되세요! 바위를 부수면 나오는 파워큐브로 강해지고, 조여오는 독가스를 피하세요.'}};
if(!SAVE.coins)SAVE.coins=0;if(!SAVE.lv)SAVE.lv={};if(!SAVE.road)SAVE.road=0;if(!SAVE.name)SAVE.name='트레이너';

function refreshMenu(){
  const c=chOf(SAVE.sel),hi=$('#heroImg');
  hi.onload=()=>{hi.style.width=(hi.naturalWidth*1.15)+'px';};hi.src=SPR[c.id];
  $('#heroName').textContent=c.nm;$('#heroLv').textContent='파워 '+lv(c.k);
  $('#heroRole').textContent=GRADE[c.gr].nm+' · '+EL[c.el].nm+' 타입 · '+c.role;
  $('#selTro').textContent=tro(c.k);
  const tt=totTro();$('#totTro').textContent=tt;$('#lbCoin').textContent=SAVE.coins;
  $('#lbName').textContent=SAVE.name;$('#lbAva').src=POR[c.id];$('#lbSqImg').src=POR[c.id];
  const nx=ROAD[SAVE.road],pv=SAVE.road?ROAD[SAVE.road-1].t:0;
  $('#lbRoad').style.width=nx?Math.min(100,(tt-pv)/(nx.t-pv)*100)+'%':'100%';
  $('#bSnd').textContent=SAVE.snd===0?'소리 끔':'소리 켬';
  const m=MODES[SAVE.mode];$('#modeName').textContent=m.nm;$('#modeDesc').textContent=m.ds;
}
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
$('#bMode').onclick=()=>{
  modal(`<h2>게임 모드 선택</h2><div class="mcards">`+Object.entries(MODES).map(([k,m])=>`<div class="mcard${k===SAVE.mode?' sel':''}" data-m="${k}"><div class="mh" style="background:${m.col}"><img class="ico big" src="${ICO[m.ico]}">${m.nm}</div><div class="mb">${m.ds}<br><br>${m.long}</div></div>`).join('')+`</div>`);
  document.querySelectorAll('.mcard').forEach(el=>el.onclick=()=>{SAVE.mode=el.dataset.m;save();refreshMenu();closeModal();});
};
$('#bRoad').onclick=()=>{
  const tt=totTro();
  modal(`<h2>트로피 로드 · 현재 ${tt}</h2><div class="road">`+ROAD.map((r,i)=>`<div class="rn${i<SAVE.road?' done':''}"><img class="ico" src="${ICO.trophy}"> ${r.t}<b>${r.c}</b>코인<br>${i<SAVE.road?'받음 ✓':tt>=r.t?'곧 받음':'잠김'}</div>`).join('')+`</div><div style="font-size:11px;opacity:.7">트로피를 모으면 코인 보상을 자동으로 받아요. 코인으로 포켓몬 파워를 올릴 수 있어요.</div><div class="mrow"><button class="btn sm" onclick="closeModal()">닫기</button></div>`);
};
$('#lbProf').onclick=()=>{
  modal(`<h2>트레이너 이름</h2><input class="minput" id="nmIn" maxlength="10" value="${SAVE.name.replace(/"/g,'')}"><div class="mrow"><button class="btn b2 sm" onclick="closeModal()">취소</button><button class="btn sm" id="nmOk">확인</button></div>`);
  $('#nmOk').onclick=()=>{const v=$('#nmIn').value.trim();if(v){SAVE.name=v.slice(0,10);save();}refreshMenu();closeModal();};
};

/* 매치메이킹 + VS 화면 */
function pickRoster(){
  const mode=SAVE.mode,pc=chOf(SAVE.sel),pl=lv(pc.k),bl=()=>clamp(pl+Math.floor(Math.random()*3)-1,1,11);
  if(mode==='gem'){const others=shuffle(CH.filter(c=>c!==pc));
    return {mode,blue:[{c:pc,lv:pl,me:1},{c:others[0],lv:bl()},{c:others[1],lv:bl()}],red:shuffle(CH.slice()).slice(0,3).map(c=>({c,lv:bl()}))};}
  return {mode,list:[{c:pc,lv:pl,me:1}].concat(shuffle(CH.filter(c=>c!==pc)).slice(0,9).map(c=>({c,lv:bl()})))};
}
let mmTimer=null;
function startMatch(){
  closeModal();const R=pickRoster(),need=R.mode==='gem'?6:10;let n=1;
  showScr('mm');
  $('#mmIn').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center"><img class="ld-ball px" src="${ICO.ball}"><div class="mm-t">${MODES[R.mode].nm} · 상대를 찾는 중...</div><div class="mm-c" id="mmC">1/${need}</div><button class="btn b2 sm" id="mmX" style="margin-top:12px">취소</button></div>`;
  $('#mmX').onclick=()=>{clearInterval(mmTimer);refreshMenu();showScr('menu');};
  clearInterval(mmTimer);
  mmTimer=setInterval(()=>{n=Math.min(need,n+1+Math.floor(Math.random()*2));const el=$('#mmC');if(el)el.textContent=n+'/'+need;
    if(n>=need){clearInterval(mmTimer);sfx('found');setTimeout(()=>{showVS(R);sfx('bigboom');},350);}},220);
}
function tmHTML(x,cls){return `<div class="tm ${cls}${x.me?' me':''}"><img src="${POR[x.c.id]}"><div>${x.me?SAVE.name:x.c.nm}</div><div style="opacity:.7">파워 ${x.lv}</div></div>`;}
function showVS(R){
  if(R.mode==='gem')$('#mmIn').innerHTML=`<div class="vs"><div class="team">${R.blue.map(x=>tmHTML(x,'b')).join('')}</div><div class="vsx">VS</div><div class="team">${R.red.map(x=>tmHTML(x,'r')).join('')}</div></div>`;
  else $('#mmIn').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div class="vsx" style="font-size:44px">쇼다운</div><div class="sdg">${R.list.map(x=>tmHTML(x,'')).join('')}</div></div>`;
  setTimeout(()=>startGame(R),1700);
}
$('#bPlay').onclick=()=>startMatch();
$('#bSnd').onclick=()=>{SAVE.snd=SAVE.snd===0?1:0;save();refreshMenu();};
$('#bAgain').onclick=()=>startMatch();

/* 로딩 */
const TIPS=['부쉬에 숨으면 가까이 오지 않는 한 적에게 보이지 않아요','필살기(★)는 공격을 맞혀서 충전해요','젬 그랩: 보석 10개 이상을 들고 15초를 버티면 승리!','쇼다운: 바위를 부수고 파워큐브를 모으세요','코인으로 포켓몬 파워 레벨을 올릴 수 있어요','짧게 탭하면 가장 가까운 적을 자동 조준해요','트로피를 모으면 트로피 로드 보상을 받아요'];
(function boot(){
  $('#ldTip').textContent='TIP · '+pick(TIPS);
  const imgs=[...Object.values(IMG),...Object.values(TI),GEM];
  CH.forEach(c=>{const im=new Image();im.src=POR[c.id];imgs.push(im);});
  let fontOk=false;try{document.fonts.load('11px Galmuri11').then(()=>fontOk=true,()=>fontOk=true);}catch(e){fontOk=true;}
  const t0=performance.now();
  const iv=setInterval(()=>{
    const done=imgs.filter(i=>i.complete).length+(fontOk?1:0),tot=imgs.length+1;
    const tp=Math.min(1,(performance.now()-t0)/1800),p=Math.min(done/tot,tp);
    $('#ldFill').style.width=Math.round(p*100)+'%';$('#ldPct').textContent=(p>=1?'완료! ':'불러오는 중... ')+Math.round(p*100)+'%';
    if(p>=1){clearInterval(iv);setTimeout(()=>{refreshMenu();showScr('menu');},250);}
  },60);
})();

/* ---------- 루프 ---------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G){try{update(dt);render();}catch(err){console.error(err);}}
}
requestAnimationFrame(loop);
</script>
